<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="title desc">
  <title id="title">V3 タッチ式チャンクグリッド例</title>
  <desc id="desc">入口チャンクを残し、中央チャンクを除外した連結採掘領域。個別・RECT・ALL・CLEAR・INVERT と進捗色を使用</desc>
  <defs><style>.h{font:700 30px sans-serif;fill:#0f172a}.l{font:600 21px sans-serif;fill:#0f172a}.s{font:17px sans-serif;fill:#334155}.chunk{stroke:#334155;stroke-width:4}.route{stroke:#dc2626;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect width="1100" height="750" fill="#fff"/>
  <text x="550" y="52" text-anchor="middle" class="h">V3 タッチ式チャンクグリッド — 例</text>
  <text x="550" y="86" text-anchor="middle" class="s">1タイル=1チャンク。白=採掘、灰=除外、緑=入口。個別／RECT／ALL／CLEAR／INVERT と進捗色を使います。</text>
  <g transform="translate(280,140)" data-grid-cell="160" data-grid-origin-x="280" data-grid-origin-y="140">
    <rect class="chunk" x="0" y="0" width="160" height="160" fill="#dcfce7"/>
    <rect class="chunk" x="160" y="0" width="160" height="160" fill="#fff"/><rect class="chunk" x="320" y="0" width="160" height="160" fill="#fff"/>
    <rect class="chunk" x="0" y="160" width="160" height="160" fill="#fff"/><rect class="chunk" x="160" y="160" width="160" height="160" fill="#94a3b8"/><text x="240" y="248" text-anchor="middle" class="l" fill="#fff">除外</text><rect class="chunk" x="320" y="160" width="160" height="160" fill="#fff"/>
    <rect class="chunk" x="0" y="320" width="160" height="160" fill="#fff"/><rect class="chunk" x="160" y="320" width="160" height="160" fill="#fff"/><rect class="chunk" x="320" y="320" width="160" height="160" fill="#fff"/>
    <path class="route" d="M40 40 L240 40 L440 40 L440 240 L440 440 L240 440 L40 440 L40 240 L40 40"/>
    <text x="80" y="78" text-anchor="middle" class="l">入口</text><text x="80" y="108" text-anchor="middle" class="s">変更不可</text>
  </g>
  <text x="550" y="680" text-anchor="middle" class="l">除外チャンクへ移動・採掘・補給・帰還経路のいずれでも侵入しません。</text>
  <text x="550" y="716" text-anchor="middle" class="s">GPS校正済みはワールド座標、未校正は相対チャンク。部分セルなし、範囲重複は開始前に拒否します。</text>
</svg>
