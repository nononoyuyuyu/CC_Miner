<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">GPSホスト立体配置例</title>
  <desc id="desc">4台以上のGPSホストを立体的に分散配置する例。ロード管理は外部設定</desc>
  <defs><style>.h{font:700 30px sans-serif;fill:#0f172a}.l{font:600 21px sans-serif;fill:#0f172a}.s{font:17px sans-serif;fill:#334155}.host{stroke:#334155;stroke-width:3}.edge{stroke:#94a3b8;stroke-width:3;stroke-dasharray:9 7;fill:none}</style></defs>
  <rect width="1100" height="700" fill="#fff"/>
  <text x="550" y="52" text-anchor="middle" class="h">GPSホスト — 立体配置例</text>
  <text x="550" y="87" text-anchor="middle" class="s">4台以上を同一平面に置かず、5〜10ブロック程度の立方体の異なる頂点へ配置します。</text>
  <g transform="translate(280,150)">
    <path class="edge" d="M100 100 L500 100 L500 400 L100 400 Z M220 0 L620 0 L620 300 L220 300 Z M100 100 L220 0 M500 100 L620 0 M500 400 L620 300 M100 400 L220 300"/>
    <rect class="host" x="70" y="70" width="60" height="60" fill="#7c3aed"/><text x="100" y="107" text-anchor="middle" class="l" fill="#fff">A</text>
    <rect class="host" x="470" y="370" width="60" height="60" fill="#7c3aed"/><text x="500" y="407" text-anchor="middle" class="l" fill="#fff">B</text>
    <rect class="host" x="190" y="-30" width="60" height="60" fill="#06b6d4"/><text x="220" y="7" text-anchor="middle" class="l">C</text>
    <rect class="host" x="590" y="270" width="60" height="60" fill="#06b6d4"/><text x="620" y="307" text-anchor="middle" class="l">D</text>
    <circle cx="360" cy="210" r="38" fill="#f59e0b" stroke="#334155" stroke-width="3"/>
    <text x="360" y="217" text-anchor="middle" class="l">採掘域</text>
  </g>
  <text x="550" y="610" text-anchor="middle" class="l">各ホストには「無線モデムブロック」のワールド座標を設定します。</text>
  <text x="550" y="646" text-anchor="middle" class="s">必要なロード範囲は外部設定で用意し、遮蔽と距離制限を確認します（CC Minerは状態を取得・自動化しません）。</text>
</svg>
