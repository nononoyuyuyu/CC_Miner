<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">採掘経路の蛇行パターン</title>
  <desc id="desc">各層を蛇行し、層の終点で一段下降して逆順に採掘する連続経路</desc>
  <defs>
    <marker id="arrow-down" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/></marker>
    <style>.h{font:700 30px sans-serif;fill:#0f172a}.l{font:600 21px sans-serif;fill:#0f172a}.s{font:17px sans-serif;fill:#334155}.grid{stroke:#cbd5e1;stroke-width:2}.path{stroke:#dc2626;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}.down{stroke:#7c3aed;stroke-width:6;stroke-dasharray:10 7;marker-end:url(#arrow-down)}</style>
  </defs>
  <rect width="1200" height="700" fill="#fff"/>
  <text x="600" y="52" text-anchor="middle" class="h">クアリー採掘経路（除外なし）</text>
  <g transform="translate(100,130)">
    <text x="210" y="-28" text-anchor="middle" class="l">第1層（Y=0）</text>
    <rect x="0" y="0" width="420" height="300" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
    <g class="grid"><path d="M70 0V300 M140 0V300 M210 0V300 M280 0V300 M350 0V300 M0 60H420 M0 120H420 M0 180H420 M0 240H420"/></g>
    <path class="path" d="M35 30 L35 270 L105 270 L105 30 L175 30 L175 270 L245 270 L245 30 L315 30 L315 270 L385 270 L385 30"/>
    <circle cx="35" cy="30" r="12" fill="#16a34a"/><text x="35" y="58" text-anchor="middle" class="s">開始</text>
    <circle cx="385" cy="30" r="12" fill="#f59e0b"/>
    <text x="210" y="336" text-anchor="middle" class="s">幅 W（+X）→</text>
    <text x="-42" y="150" text-anchor="middle" class="s" transform="rotate(90 -42 150)">長さ L（+Z）</text>
  </g>
  <g transform="translate(680,260)">
    <text x="210" y="-28" text-anchor="middle" class="l">第2層（Y=-1）</text>
    <rect x="0" y="0" width="420" height="300" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
    <g class="grid"><path d="M70 0V300 M140 0V300 M210 0V300 M280 0V300 M350 0V300 M0 60H420 M0 120H420 M0 180H420 M0 240H420"/></g>
    <path class="path" d="M385 30 L385 270 L315 270 L315 30 L245 30 L245 270 L175 270 L175 30 L105 30 L105 270 L35 270 L35 30"/>
    <circle cx="35" cy="30" r="12" fill="#2563eb"/><text x="35" y="58" text-anchor="middle" class="s">層終点</text>
  </g>
  <path class="down" d="M485 160 C700 105,980 105,1090 210 L1090 265 L1065 290" fill="none"/>
  <rect x="610" y="80" width="250" height="48" rx="10" fill="#fff"/>
  <text x="735" y="112" text-anchor="middle" class="l" fill="#7c3aed">1ブロック下降</text>
  <text x="600" y="640" text-anchor="middle" class="l">除外が無いジョブでは、全セルを一度ずつ通る高速経路を使います。</text>
  <text x="600" y="673" text-anchor="middle" class="s">除外がある場合はチャンク単位の連結DFS経路へ自動切り替えします。</text>
</svg>
