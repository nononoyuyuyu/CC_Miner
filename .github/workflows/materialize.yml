name: Materialize CC Miner V2

on:
  push:
    branches:
      - agent/cc-miner-v2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Expand the repository payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo

          if [ ! -d .ccminer-payload ]; then
            echo "No materialization payload is present; nothing to do."
            exit 0
          fi

          cat .ccminer-payload/part-* | base64 -d > /tmp/ccminer-payload.tar.gz
          echo "dbfd680bff4a4304621f7a2588b505d9560bf583675035512175759ce9d146df  /tmp/ccminer-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ccminer-payload.tar.gz
          rm -rf .ccminer-payload

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add CC Miner V2 implementation and documentation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
